services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      BANTAI_API_DOMAIN: ${BANTAI_API_DOMAIN:?Set the public Signalam API domain}
      BANTAI_WEB_DOMAIN: ${BANTAI_WEB_DOMAIN:?Set the public Signalam dashboard domain}
      BANTAI_ROOT_DOMAIN: ${BANTAI_ROOT_DOMAIN:?Set the public Signalam root domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - bantai_caddy_data:/data
      - bantai_caddy_config:/config
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - edge

  web:
    image: signalam-web:1.1.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_BANTAI_API_URL: /api/v1
        NEXT_PUBLIC_SITE_URL: ${BANTAI_WEB_ORIGIN:?Set the HTTPS dashboard origin}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      BANTAI_API_ORIGIN: http://platform:8080
      BANTAI_ALLOW_PRIVATE_PLATFORM_ORIGIN: "true"
    expose:
      - "3000"
    depends_on:
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 20s
    networks:
      - edge

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bantai
      MYSQL_ROOT_PASSWORD: ${BANTAI_DB_ROOT_PASSWORD:?Set BANTAI_DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - bantai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  db-roles:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${BANTAI_DB_ROOT_PASSWORD:?Set BANTAI_DB_ROOT_PASSWORD}
      BANTAI_DB_RUNTIME_PASSWORD: ${BANTAI_DB_RUNTIME_PASSWORD:?Set BANTAI_DB_RUNTIME_PASSWORD}
      BANTAI_DB_MIGRATION_PASSWORD: ${BANTAI_DB_MIGRATION_PASSWORD:?Set BANTAI_DB_MIGRATION_PASSWORD}
    volumes:
      - ./deploy/mysql/create-roles.sh:/usr/local/bin/create-roles.sh:ro
    command: ["sh", "/usr/local/bin/create-roles.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

  migration:
    image: signalam-platform:1.1.0
    build:
      context: .
      dockerfile: shared_platform/Dockerfile
    restart: "no"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      BANTAI_DATABASE_URL: mysql+pymysql://bantai_migration:${BANTAI_DB_MIGRATION_PASSWORD:?Set BANTAI_DB_MIGRATION_PASSWORD}@mysql:3306/bantai
      BANTAI_CREATE_SCHEMA: "false"
      BANTAI_ENCRYPTION_KEY: ${BANTAI_ENCRYPTION_KEY:?Set BANTAI_ENCRYPTION_KEY}
    command: ["python", "-m", "alembic", "-c", "shared_platform/alembic.ini", "upgrade", "head"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
    networks:
      - data

  detector:
    image: signalam-detector:1.1.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BANTAI_MODEL_DIR: /app/models/email_text_xlmr_v2/full_taglish_xlmr_512_headtail_seed13
      BANTAI_RF_MODEL_PATH: /app/models/url_random_forest_grouped_v1/bantai_rf_grouped_v1.0.0.joblib
      BANTAI_URL_MODEL_ENFORCEMENT_ENABLED: "false"
      BANTAI_REMOTE_SERVER_MODE: "true"
      BANTAI_INTERNAL_API_KEY: ${BANTAI_INTERNAL_API_KEY:?Set BANTAI_INTERNAL_API_KEY}
      BANTAI_LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set the backend-only Gemini key}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GEMINI_URL_MODEL: ${GEMINI_URL_MODEL:-gemini-3.5-flash-lite}
      BANTAI_LLM_TIMEOUT_SECONDS: ${BANTAI_LLM_TIMEOUT_SECONDS:-12}
      BANTAI_LLM_MAX_RETRIES: ${BANTAI_LLM_MAX_RETRIES:-0}
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-BantAI-Internal-Key':os.environ['BANTAI_INTERNAL_API_KEY']}); urllib.request.urlopen(r,timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s
    stop_grace_period: 30s
    networks:
      - inference
      - egress

  platform:
    image: signalam-platform:1.1.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    build:
      context: .
      dockerfile: shared_platform/Dockerfile
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      BANTAI_DATABASE_URL: mysql+pymysql://bantai_runtime:${BANTAI_DB_RUNTIME_PASSWORD:?Set BANTAI_DB_RUNTIME_PASSWORD}@mysql:3306/bantai
      BANTAI_DETECTOR_URL: http://detector:8000
      BANTAI_INTERNAL_API_KEY: ${BANTAI_INTERNAL_API_KEY:?Set BANTAI_INTERNAL_API_KEY}
      BANTAI_REMOTE_RUNTIME_REQUIRED: "true"
      BANTAI_PUBLIC_REGISTRATION_ENABLED: "false"
      BANTAI_WEB_ORIGIN: ${BANTAI_WEB_ORIGIN:?Set the HTTPS dashboard origin}
      BANTAI_EXTENSION_ORIGIN: ${BANTAI_EXTENSION_ORIGIN:?Set the released extension origin}
      BANTAI_COOKIE_SECURE: "true"
      BANTAI_CREATE_SCHEMA: "false"
      BANTAI_ENCRYPTION_KEY: ${BANTAI_ENCRYPTION_KEY:?Set the 32-byte base64 encryption key}
      BANTAI_ADMIN_EMAIL: ${BANTAI_ADMIN_EMAIL:-}
      BANTAI_ADMIN_PASSWORD: ${BANTAI_ADMIN_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set the backend-only Gemini key}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GEMINI_URL_MODEL: ${GEMINI_URL_MODEL:-gemini-3.5-flash-lite}
      BANTAI_LLM_TIMEOUT_SECONDS: ${BANTAI_LLM_TIMEOUT_SECONDS:-12}
      BANTAI_DETECTOR_READINESS_TIMEOUT_SECONDS: ${BANTAI_DETECTOR_READINESS_TIMEOUT_SECONDS:-5}
      BANTAI_DETECTOR_INFERENCE_TIMEOUT_SECONDS: ${BANTAI_DETECTOR_INFERENCE_TIMEOUT_SECONDS:-45}
      BANTAI_MAX_REQUEST_BYTES: "262144"
      BANTAI_DETECTION_RATE_LIMIT_PER_5_MINUTES: ${BANTAI_DETECTION_RATE_LIMIT_PER_5_MINUTES:-120}
      BANTAI_TRUSTED_PROXY_CIDRS: ${BANTAI_TRUSTED_PROXY_CIDRS:?Set the private Caddy source CIDR or address}
      BANTAI_TRANSIENT_CONTEXT_TTL_SECONDS: "600"
      BANTAI_TRANSIENT_CONTEXT_MAX_ENTRIES: "512"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      detector:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready',timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - edge
      - inference
      - data

volumes:
  bantai_mysql:
  bantai_caddy_data:
  bantai_caddy_config:

networks:
  edge:
  inference:
    internal: true
  data:
    internal: true
  egress:
