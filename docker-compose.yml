services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bantai
      MYSQL_USER: bantai
      MYSQL_PASSWORD: bantai-development
      MYSQL_ROOT_PASSWORD: bantai-root-development
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    # MySQL is intentionally reachable only by the platform container.
    # The web interface and Windows companion communicate with the API on 8080.
    volumes:
      - bantai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubantai", "-pbantai-development"]
      interval: 5s
      timeout: 5s
      retries: 20

  platform:
    restart: unless-stopped
    build:
      context: .
      dockerfile: shared_platform/Dockerfile
    env_file:
      - path: ./shared_platform/.env
        required: false
    environment:
      BANTAI_DATABASE_URL: mysql+pymysql://bantai:bantai-development@mysql:3306/bantai
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  detector:
    image: bantai-detector:latest
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BANTAI_MODEL_DIR: /app/models/email_text_xlmr_v1/checkpoint-15666
      BANTAI_RF_MODEL_PATH: /app/models/url_random_forest_v4b/bantai_rf_url_model_v4b_optimized.joblib
      BANTAI_PLATFORM_API: http://platform:8080
      BANTAI_COMPANION_STATE_PATH: /data/companion.dat
      BANTAI_WEB_ORIGIN: http://localhost:3000
      BANTAI_WEB_DASHBOARD: http://localhost:3000
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bantai_companion:/data
    depends_on:
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    stop_grace_period: 30s

volumes:
  bantai_mysql:
  bantai_companion:
